<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhira Insights - I Have a Dream MCQ Quiz</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --accent: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            padding: 30px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #818cf8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
        }

        .stat-item span {
            color: #38bdf8;
        }

        .question-box {
            font-size: 1.15rem;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: rgba(51, 65, 85, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            padding: 12px 18px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.3);
            border-color: var(--accent);
            color: #dcfce7;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.3);
            border-color: var(--danger);
            color: #fee2e2;
        }

        .next-btn {
            display: none;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .result-screen p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .restart-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Abhira Insights</h1>
            <p>Bihar Board Class 12 English - I Have a Dream Challenge</p>
        </header>

        <div id="quiz-container">
            <div class="game-stats">
                <div class="stat-item">Question: <span id="current-q">1</span>/5</div>
                <div class="stat-item">Score: <span id="score">0</span></div>
            </div>

            <div class="question-box" id="question-text">
                Question loading...
            </div>

            <div class="options-list" id="options-container">
                <!-- Options will load dynamically via JS -->
            </div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
        </div>

        <div class="result-screen" id="result-screen">
            <h2>Quiz Completed! 🎉</h2>
            <p id="final-score-text">Your Score: 0/5</p>
            <button class="restart-btn" onclick="restartQuiz()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Who is the author of the speech 'I Have a Dream'?",
                options: ["Mahatma Gandhi", "Martin Luther King Jr.", "Bertrand Russell", "H.E. Bates"],
                answer: 1
            },
            {
                question: "Martin Luther King Jr. was a civil rights activist belonging to which country?",
                options: ["England", "South Africa", "United States of America", "Canada"],
                answer: 2
            },
            {
                question: "When was Martin Luther King Jr. awarded the Nobel Peace Prize?",
                options: ["1960", "1964", "1968", "1955"],
                answer: 1
            },
            {
                question: "According to the speech, the Negroes are crippled by what?",
                options: ["The manacles of segregation and the chains of discrimination", "Lack of education", "Natural disasters", "Economic support"],
                answer: 0
            },
            {
                question: "'I Have a Dream' is a speech delivered on the steps of the Lincoln Memorial in which city?",
                options: ["New York", "Washington, D.C.", "Chicago", "Boston"],
                answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const currentQSpan = document.getElementById("current-q");
        const scoreSpan = document.getElementById("score");
        const nextBtn = document.getElementById("next-btn");
        const quizContainer = document.getElementById("quiz-container");
        const resultScreen = document.getElementById("result-screen");
        const finalScoreText = document.getElementById("final-score-text");

        function loadQuiz() {
            answered = false;
            nextBtn.style.display = "none";
            
            const currentQuiz = quizData[currentQuestionIndex];
            currentQSpan.innerText = currentQuestionIndex + 1;
            questionText.innerText = currentQuiz.question;
            
            optionsContainer.innerHTML = "";
            currentQuiz.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, buttonElement) {
            if (answered) return;
            answered = true;

            const currentQuiz = quizData[currentQuestionIndex];
            const allButtons = optionsContainer.children;

            if (selectedIndex === currentQuiz.answer) {
                buttonElement.classList.add("correct");
                score += 1;
                scoreSpan.innerText = score;
            } else {
                buttonElement.classList.add("wrong");
                allButtons[currentQuiz.answer].classList.add("correct");
            }

            // Disable all options after selection
            Array.from(allButtons).forEach(btn => btn.disabled = true);
            
            // Show next button or finish
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.style.display = "block";
            } else {
                setTimeout(showResult, 1000);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuiz();
        }

        function showResult() {
            quizContainer.style.display = "none";
            resultScreen.style.display = "block";
            finalScoreText.innerText = `You scored ${score} out of ${quizData.length}!`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreSpan.innerText = score;
            quizContainer.style.display = "block";
            resultScreen.style.display = "none";
            loadQuiz();
        }

        // Initialize quiz
        loadQuiz();
    </script>
</body>
</html>
