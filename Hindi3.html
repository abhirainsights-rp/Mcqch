<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhira Insights Quiz</title>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .question { font-size: 1.2rem; margin-bottom: 20px; font-weight: 600; }
        .option { display: block; width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: 0.3s; background: white; text-align: left; }
        .option:hover { background: #eef2ff; border-color: var(--primary); }
        .correct { background: #dcfce7 !important; border-color: #22c55e !important; }
        .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; }
        #progress { margin-bottom: 15px; color: #64748b; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Abhira Insights</h1>
    <div id="progress">प्रश्न 1/50</div>
    <div id="quiz">
        <div class="question" id="question">Loading...</div>
        <div id="options"></div>
    </div>
</div>

<script>
    const quizData = [
        // Usne Kaha Tha (25)
        { q: "उसने कहा था कहानी के लेखक कौन हैं?", o: ["बालकृष्ण भट्ट", "चंद्रधर शर्मा गुलेरी", "जयप्रकाश नारायण", "नामवर सिंह"], a: 1 },
        { q: "उसने कहा था कहानी कब प्रकाशित हुई?", o: ["1915", "1912", "1920", "1910"], a: 0 },
        { q: "लहना सिंह की कहानी क्या है?", o: ["युद्ध की कहानी", "प्रेम की कहानी", "बलिदान की कहानी", "उपर्युक्त सभी"], a: 3 },
        { q: "लहना सिंह किस पद पर था?", o: ["सूबेदार", "जमादार", "लेफ्टिनेंट", "कर्नल"], a: 1 },
        { q: "उसने कहा था कहानी कहाँ से शुरू होती है?", o: ["अमृतसर के भीड़ भरे बाजार से", "युद्ध के मैदान से", "गांव के खेत से", "दिल्ली से"], a: 0 },
        { q: "लहना सिंह के गांव का क्या नाम था?", o: ["मंझरे", "मांझे", "कटरा", "बेलघरिया"], a: 1 },
        { q: "लहना सिंह का सिर किसकी गोद में था?", o: ["बजीरा सिंह", "सूबेदार हजारा सिंह", "बोधा सिंह", "इनमें से कोई नहीं"], a: 0 },
        { q: "लहना सिंह ने अपनी जेब से क्या निकाला?", o: ["पिस्तौल", "पत्र", "रूमाल", "पैसा"], a: 1 },
        { q: "सुबेदारनी ने अपने पति और पुत्र की रक्षा के लिए किससे कहा?", o: ["वजीर सिंह", "लहना सिंह", "बोधा सिंह", "अतर सिंह"], a: 1 },
        { q: "लहना सिंह का भतीजा कौन था?", o: ["कीरत सिंह", "बजीरा सिंह", "बोधा सिंह", "हजारा सिंह"], a: 0 },
        { q: "लहना सिंह किस युद्ध में लड़ रहा था?", o: ["प्रथम विश्व युद्ध", "द्वितीय विश्व युद्ध", "पानीपत का युद्ध", "इनमें से कोई नहीं"], a: 0 },
        { q: "लहना सिंह की मृत्यु किसकी गोद में हुई?", o: ["बजीरा सिंह", "सूबेदार", "कीरत सिंह", "इनमें से कोई नहीं"], a: 0 },
        { q: "लहना सिंह ने किसको बचाया?", o: ["हजारा सिंह को", "बोधा सिंह को", "कीरत सिंह को", "बजीरा सिंह को"], a: 1 },
        { q: "उसने कहा था कहानी के नायक कौन है?", o: ["वजीरा सिंह", "लहना सिंह", "बोधा सिंह", "हजारा सिंह"], a: 1 },
        { q: "लहना सिंह के कितने भाई थे?", o: ["दो", "तीन", "चार", "पांच"], a: 1 },
        { q: "लहना सिंह का अपना घर कहाँ था?", o: ["मांझे में", "अमृतसर में", "लुधियाना में", "जालंधर में"], a: 0 },
        { q: "उसने कहा था कहानी का मुख्य भाव क्या है?", o: ["प्रेम", "बलिदान", "वीरता", "ये सभी"], a: 3 },
        { q: "लहना सिंह ने सुबेदारनी को क्या वचन दिया था?", o: ["उसके पति की रक्षा का", "उसके बेटे की रक्षा का", "पति और बेटे दोनों की रक्षा का", "उससे विवाह का"], a: 2 },
        { q: "लहना सिंह के बचपन का नाम क्या था?", o: ["लहना", "लहना सिंह", "सिंह", "कोई नहीं"], a: 0 },
        { q: "कहानी में किस नगर का वर्णन है?", o: ["अमृतसर", "लुधियाना", "जालंधर", "चंडीगढ़"], a: 0 },
        { q: "लहना सिंह ने जर्मन सैनिक को कहाँ मारा?", o: ["खेत में", "खाई में", "बाजार में", "घर में"], a: 1 },
        { q: "चंद्रधर शर्मा गुलेरी का जन्म कहाँ हुआ था?", o: ["जयपुर", "जबलपुर", "कानपुर", "भोपाल"], a: 0 },
        { q: "लहना सिंह ने अपनी जान देकर किसे बचाया?", o: ["सूबेदार हजारा सिंह", "बोधा सिंह", "बजीरा सिंह", "कीरत सिंह"], a: 1 },
        { q: "कहानी में 'उसने कहा था' शीर्षक का अर्थ क्या है?", o: ["सुबेदारनी की मांग", "लहना सिंह की प्रतिज्ञा", "युद्ध का आदेश", "इनमें से कोई नहीं"], a: 0 },
        { q: "लहना सिंह की उम्र क्या थी?", o: ["25 वर्ष", "30 वर्ष", "35 वर्ष", "40 वर्ष"], a: 2 },
        
        // Grammar (25)
        { q: "अलंकार के कितने प्रकार होते हैं?", o: ["दो", "तीन", "चार", "पांच"], a: 1 },
        { q: "हिंदी वर्णमाला में कितने स्वर हैं?", o: ["11", "13", "10", "12"], a: 0 },
        { q: "समास के कितने भेद हैं?", o: ["चार", "पांच", "छह", "सात"], a: 2 },
        { q: "शुद्ध वर्तनी वाला शब्द कौन सा है?", o: ["कालिदास", "कालीदास", "कलिदास", "कालिदाश"], a: 0 },
        { q: "‘आकाश’ का पर्यायवाची शब्द है?", o: ["अग्नि", "नभ", "धरती", "वायु"], a: 1 },
        { q: "‘जय’ का विलोम शब्द है?", o: ["विजय", "पराजय", "हार", "जीत"], a: 1 },
        { q: "‘राम ने आम खाया’ में कौन सा कारक है?", o: ["कर्ता", "कर्म", "करण", "अपादान"], a: 0 },
        { q: "‘नायक’ का सही संधि विच्छेद है?", o: ["ने+अक", "ना+यक", "न+अक", "नै+अक"], a: 3 },
        { q: "‘कमल’ कैसा शब्द है?", o: ["रूढ़", "योगरूढ़", "यौगिक", "कोई नहीं"], a: 0 },
        { q: "‘पढ़ने वाला’ में कौन सा प्रत्यय है?", o: ["वाला", "पढ़", "अने", "एला"], a: 0 },
        { q: "‘अत्याचार’ में कौन सा उपसर्ग है?", o: ["अति", "अत", "अत्या", "चार"], a: 0 },
        { q: "‘हिमालय’ में कौन सी संधि है?", o: ["दीर्घ", "गुण", "वृद्धि", "यण"], a: 0 },
        { q: "‘दिन’ का विशेषण क्या होगा?", o: ["दिनकर", "दैनिक", "दिनदा", "दिना"], a: 1 },
        { q: "‘हाथ मलना’ मुहावरे का अर्थ है?", o: ["मारना", "पछताना", "खुजली करना", "दवा लगाना"], a: 1 },
        { q: "‘अमृत’ का पर्यायवाची है?", o: ["सुधा", "अनल", "पावक", "नीरज"], a: 0 },
        { q: "‘मैं’ कौन सा पुरुष है?", o: ["उत्तम पुरुष", "मध्यम पुरुष", "अन्य पुरुष", "कोई नहीं"], a: 0 },
        { q: "‘सत्य’ का विलोम है?", o: ["असत्य", "झूठ", "मिध्या", "अधर्म"], a: 0 },
        { q: "संधि के कितने भेद हैं?", o: ["दो", "तीन", "चार", "पांच"], a: 1 },
        { q: "‘गजानन’ में कौन सा समास है?", o: ["तत्पुरुष", "कर्मधारय", "बहुव्रीहि", "द्वंद्व"], a: 2 },
        { q: "‘पुस्तक’ कौन सा लिंग है?", o: ["स्त्रीलिंग", "पुल्लिंग", "उभयलिंग", "कोई नहीं"], a: 0 },
        { q: "‘घोड़ा’ का बहुवचन क्या है?", o: ["घोड़े", "घोडो", "घोड़ियाँ", "कोई नहीं"], a: 0 },
        { q: "भाषा की सबसे छोटी इकाई क्या है?", o: ["शब्द", "व्यंजन", "वर्ण", "स्वर"], a: 2 },
        { q: "‘सुंदर’ का पर्यायवाची क्या है?", o: ["कुरूप", "मनोहर", "कुरु", "बुरा"], a: 1 },
        { q: "‘अज्ञान’ का विलोम है?", o: ["ज्ञान", "बुद्धि", "समझ", "चेतन"], a: 0 },
        { q: "‘ईमानदार’ में कौन सा संज्ञा है?", o: ["जातिवाचक", "व्यक्तिवाचक", "भाववाचक", "समूहवाचक"], a: 2 }
    ];

    let currentQ = 0;
    let score = 0;

    function render() {
        if(currentQ >= quizData.length) {
            document.getElementById('quiz').innerHTML = `<h2>Quiz Finished! Your Score: ${score}/${quizData.length}</h2>`;
            return;
        }
        document.getElementById('progress').innerText = `प्रश्न ${currentQ + 1}/${quizData.length}`;
        const q = quizData[currentQ];
        document.getElementById('question').innerText = q.q;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        q.o.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => check(idx, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function check(idx, btn) {
        const correct = quizData[currentQ].a;
        if(idx === correct) {
            score++;
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            document.querySelectorAll('.option')[correct].classList.add('correct');
        }
        setTimeout(() => { currentQ++; render(); }, 1000);
    }

    render();
</script>
</body>
</html>
