*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mangal","Nirmala UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
header{text-align:center;padding:10px 12px 4px}

h2{margin:2px 0 0;font-size:clamp(16px,2.4vw,26px);color:var(--mut);font-weight:600}
.bar{height:8px;background:#0001;margin:8px 3vw;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--c);transition:.5s}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 3vw;min-height:0}
.card{width:100%;max-width:1400px;max-height:100%;overflow:auto;background:var(--card);border-radius:22px;border:4px solid var(--c);box-shadow:0 8px 0 var(--c);padding:clamp(14px,2.5vw,36px);animation:pop .5s}

.top{display:flex;align-items:center;gap:12px}.em{font-size:clamp(40px,7vw,84px);animation:bn 2s infinite}
@keyframes bn{50%{transform:translateY(-8px) rotate(6deg)}}
h3{margin:0;font-size:clamp(24px,4vw,46px);color:var(--c)}
.k{display:inline-block;margin:10px 0;padding:8px 18px;border-radius:40px;background:var(--c);color:#fff;font-weight:800;font-size:clamp(18px,2.8vw,32px)}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin:12px 0}
.ex{border:3px dashed var(--c);border-radius:16px;padding:12px;text-align:center;cursor:pointer;background:#0000000a;transition:.2s}.ex:hover{transform:scale(1.03)}
.ex b{display:block;font-size:clamp(22px,3.2vw,38px);color:var(--c)}.ex span{font-size:clamp(15px,2vw,24px)}
.n{background:#f59f0030;border-left:8px solid var(--c);border-radius:10px;padding:10px 14px;font-size:clamp(15px,2.1vw,25px);line-height:1.5}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px 8px 12px}
button{font:inherit;font-weight:700;font-size:clamp(15px,2vw,22px);border:0;border-radius:40px;padding:10px 20px;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 4px 0 #0004}button:active{transform:translateY(3px);box-shadow:none}

.opt.ok{background:#2f9e44;color:#fff}.opt.no{background:#e03131;color:#fff}
#cv{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
.big{text-align:center}.big .em{font-size:90px}

var i=0,auto=true,mode="s",qi=0,sc=0,lock=false,tm,cd=document.getElementById("cd"),nv=document.getElementById("nv"),pb=document.getElementById("pb"),AC;
var syn=window.speechSynthesis;
function beep(f,d){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function say(tx,cb){clearTimeout(tm);var done=false;function fin(){if(!done){done=true;clearTimeout(tm);cb&&cb()}}
if(!syn){tm=setTimeout(fin,tx.length*80+3000);return}
syn.cancel();var u=new SpeechSynthesisUtterance(tx);u.lang="hi-IN";u.rate=.9;var v=syn.getVoices().filter(function(x){return/hi/i.test(x.lang)})[0];if(v)u.voice=v;u.onend=fin;u.onerror=fin;syn.speak(u);tm=setTimeout(fin,tx.length*130+6000)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function nav(h){nv.innerHTML=h}
function slide(){mode="s";var s=S[i];document.documentElement.style.setProperty("--c",s.c||"#e8590c");pb.style.width=((i+1)/(S.length+1)*100)+"%";
cd.style.borderColor=cd.style.boxShadow="";
cd.innerHTML='<div class="top"><span class="em">'+s.e+'</span><h3>'+s.t+'</h3></div><div class="k">'+s.k+'</div><p class="h">'+s.h+'</p><div class="g">'+s.ex.map(function(x,j){return'<div class="ex" onclick="say(\''+(x[0]+" "+(s.j||"यानी")+" "+x[1]).replace(/'/g,"")+'\')"><b>'+x[0]+'</b><span>'+(s.j?"➜ ":"= ")+x[1]+'</span></div>'}).join("")+'</div><div class="n">💡 '+s.n+'</div>';
nav('<button class="o" onclick="go(-1)">⬅ पीछे</button><button onclick="rep()">🔊 फिर सुनो</button><button class="o" id="au" onclick="tg()">'+(auto?"⏸ ऑटो चालू":"▶ ऑटो बंद")+'</button><button onclick="go(1)">आगे ➡</button>');
beep(660,.15);rep()}
function rep(){var s=S[i];if(!auto){say(spk(s));return}say(spk(s),function(){setTimeout(function(){if(auto&&mode=="s")go(1)},1200)})}
function spk(s){return s.t+". "+s.k.replace(/[“”]/g,"")+". "+s.h+" उदाहरण: "+s.ex.map(function(x){return x[0]+" "+(s.j||"यानी")+" "+x[1]}).join(". ")+". "+s.n}
function tg(){auto=!auto;if(auto)rep();else{syn&&syn.cancel();clearTimeout(tm)}document.getElementById("au").textContent=auto?"⏸ ऑटो चालू":"▶ ऑटो बंद"}
function go(d){syn&&syn.cancel();clearTimeout(tm);i+=d;if(i<0)i=0;if(i>=S.length){quiz(0);return}slide()}
function start(){cd.innerHTML='<div class="big"><div class="em">🌟</div><h3>स्वागत है, दोस्तों!</h3><p class="h">कक्षा 10, 12 और प्रतियोगी परीक्षाओं की तैयारी के लिए समास का पूरा पाठ। आवाज़ ऑन रखो और बटन दबाओ!</p></div>';document.documentElement.style.setProperty("--c","#f08c00");nav('<button onclick="slide()">▶ पाठ शुरू करें</button>');pb.style.width="2%"}
function quiz(n){mode="q";qi=n;lock=false;if(n==0)sc=0;document.documentElement.style.setProperty("--c","#7048e8");pb.style.width=(100*(n+1)/12)+"%";
if(n>=Q.length)return fin();var q=Q[n];cd.innerHTML='<div class="top"><span class="em">📝</span><h3>सवाल '+(n+1)+' / 12</h3></div><p class="h"><b>'+q[0]+'</b></p>'+q[1].map(function(o,j){return'<button class="opt" onclick="pick('+j+')">'+"ABCD"[j]+") "+o+'</button>'}).join("")+'<div class="n" id="ex" style="display:none"></div>';
nav('<button class="o" onclick="say(Q[qi][0])">🔊 सवाल सुनो</button><button id="nx" style="display:none" onclick="quiz(qi+1)">अगला ➡</button>');say(q[0])}
function pick(j){if(lock)return;lock=true;var q=Q[qi],b=cd.querySelectorAll(".opt");b[q[2]].classList.add("ok");var r=j==q[2];if(r){sc++;beep(880,.25);conf(40)}else{b[j].classList.add("no");beep(200,.4)}
var e=document.getElementById("ex");e.style.display="block";e.textContent=(r?"✅ बिल्कुल सही! ":"❌ सही उत्तर "+"ABCD"[q[2]]+" है। ")+q[3];say((r?"बहुत बढ़िया! ":"कोई बात नहीं। ")+q[3]);document.getElementById("nx").style.display="inline-block"}
function fin(){var m=sc>=10?"समास मास्टर! 🏆":sc>=7?"बहुत अच्छे! 🌟":"और अभ्यास करो, तुम कर सकते हो! 💪";cd.innerHTML='<div class="big"><div class="em">🎉</div><h3>तुम्हारा स्कोर: '+sc+' / 12</h3><p class="h">'+m+'</p></div>';nav('<button onclick="quiz(0)">🔁 फिर से खेलें</button><button class="o" onclick="i=0;slide()">📖 पाठ दोबारा</button>');conf(160);say("तुम्हारा स्कोर "+sc+" बारह में से। "+m.replace(/[^\u0900-\u097F\s।!]/g,""))}
function conf(n){var c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;var p=[],k=["#f59f00","#e8590c","#0c8599","#d6336c","#2f9e44","#7048e8"];for(var a=0;a<n;a++)p.push({x:Math.random()*c.width,y:-10,vx:Math.random()*4-2,vy:Math.random()*4+2,s:Math.random()*8+4,c:k[a%6]});
(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s)});p=p.filter(function(q){return q.y<c.height});if(p.length)requestAnimationFrame(f)})()}
start();
</script></body></html>
